<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>KEEFER</title>
</head>

<body>
    <div class="header flex">
        <div class="left">
            <img id="logo" src="./Assets/looo.png" alt="Keffer Logo" class="w-200 h-auto ">
        </div>
        <div class="right">
            <h1 class="text-2xl md:text-2xl lg:text-2xl font-bold absolute top-0 right-0 py-3 px-3 letter-spacing-wide text-red-800 "
                id="heading-1">CALL OUR OFFICES NOW!</h1>
            <div class="border-t-3 border-gray-900 w-70 mt-13 ml-64 mb-1"></div>
            <div
                class="number text-4xl md:text-3xl lg:text-4xl tracking-widest font-bold absolute top-14 right-0 py-3 px-3 mb-1 ">
                540.433.6906</div>
            <div class="paragraph absolute top-28 right-0 py-3 px-3 text-lg font-bold mb-3" id="paragraph-1">
                <p>Get Your Question Answered Fast</p>
            </div>
        </div>
    </div>
    <nav class="navbar bg-red-800 text-white h-12 flex items-center px-4 font-Roboto">
        <ul class="flex space-x-12 justify-end w-full text-xl">
            <li class="cursor-pointer">HOME</li>
            <li class="cursor-pointer">BIOGRAPHY</li>
            <li class="cursor-pointer">BLOG</li>
            <li class="cursor-pointer">AREA WE SERVE</li>
            <li class="cursor-pointer">LIBRARY</li>
            <li class="cursor-pointer">CONTACT</li>
        </ul>
    </nav>
    <div class="second flex">
        <div class="image px-10 py-10">
            <img src="./Assets/gurantee_banner.gif" alt="Office Image" class="w-200 h-100  ">
        </div>
        <div class="image-2 my-9 mr-12 h-75">
            <img src="./Assets/form_bg.jpg" alt="Office Image" class="w-180  h-100">
        </div>
    </div>
</body>

</html>
